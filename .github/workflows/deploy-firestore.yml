name: Deploy Firestore Rules & Indexes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'

jobs:
  deploy-firestore:
    name: Deploy Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Firestore rules and indexes
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-sa.json
          pip install --quiet google-auth requests
          python3 << 'PYEOF'
          import json, sys, requests
          import google.oauth2.service_account
          import google.auth.transport.requests

          with open('/tmp/firebase-sa.json') as f:
              sa = json.load(f)

          PROJECT = sa['project_id']
          print(f'Project: {PROJECT}')

          creds = google.oauth2.service_account.Credentials.from_service_account_info(
              sa,
              scopes=['https://www.googleapis.com/auth/cloud-platform',
                      'https://www.googleapis.com/auth/firebase'])
          creds.refresh(google.auth.transport.requests.Request())
          HEADERS = {'Authorization': f'Bearer {creds.token}', 'Content-Type': 'application/json'}

          # ── Desplegar reglas ──────────────────────────────────────────────
          with open('firestore.rules') as f:
              rules_source = f.read()

          r = requests.post(
              f'https://firebaserules.googleapis.com/v1/projects/{PROJECT}/rulesets',
              headers=HEADERS,
              json={'source': {'files': [{'name': 'firestore.rules', 'content': rules_source}]}}
          )
          if not r.ok:
              print(f'ERROR al crear ruleset: {r.status_code} {r.text}', file=sys.stderr)
              sys.exit(1)
          ruleset_name = r.json()['name']
          print(f'Ruleset creado: {ruleset_name}')

          r = requests.patch(
              f'https://firebaserules.googleapis.com/v1/projects/{PROJECT}/releases/cloud.firestore',
              headers=HEADERS,
              params={'updateMask': 'release.ruleset_name'},
              json={'release': {
                  'name': f'projects/{PROJECT}/releases/cloud.firestore',
                  'rulesetName': ruleset_name
              }}
          )
          if not r.ok:
              print(f'ERROR al actualizar release: {r.status_code} {r.text}', file=sys.stderr)
              sys.exit(1)
          print('✔ Reglas desplegadas')

          # ── Desplegar índices ─────────────────────────────────────────────
          with open('firestore.indexes.json') as f:
              index_data = json.load(f)

          DB = f'projects/{PROJECT}/databases/(default)'

          for idx in index_data.get('indexes', []):
              coll = idx['collectionGroup']
              fields = [
                  {'fieldPath': f['fieldPath'],
                   'order': f.get('order', 'ASCENDING')}
                  for f in idx['fields']
              ]
              body = {
                  'queryScope': idx.get('queryScope', 'COLLECTION'),
                  'fields': fields
              }
              r = requests.post(
                  f'https://firestore.googleapis.com/v1/{DB}/collectionGroups/{coll}/indexes',
                  headers=HEADERS,
                  json=body
              )
              if r.status_code == 409:
                  print(f'Índice ya existe: {coll} {[f["fieldPath"] for f in fields]}')
              elif not r.ok:
                  print(f'ERROR al crear índice {coll}: {r.status_code} {r.text}', file=sys.stderr)
                  sys.exit(1)
              else:
                  op = r.json().get('name', '')
                  print(f'✔ Índice en construcción: {coll} → {op}')

          print('Despliegue completado.')
          PYEOF
          rm /tmp/firebase-sa.json
