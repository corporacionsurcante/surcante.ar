name: Deploy Firestore Rules & Indexes

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'

jobs:
  deploy-firestore:
    name: Deploy Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract project ID from service account
        id: project
        run: |
          PROJECT_ID=$(echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' | python3 -c "import sys,json; print(json.load(sys.stdin)['project_id'])")
          echo "id=$PROJECT_ID" >> $GITHUB_OUTPUT

      - name: Deploy Firestore rules and indexes
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          npx --yes firebase-tools@latest deploy --only firestore \
            --project ${{ steps.project.outputs.id }} \
            --non-interactive
          rm /tmp/firebase-sa.json
